<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#397E73">
  <meta name="description" content="생각은 지금 적고, 정리는 나중에.">
  <title>까먹자</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="icon-library" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.4-3.4"></path></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14h-.2v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m6 11 6-6 6 6M12 5v14"></path></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3zM12 15v6"></path></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"></path></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></symbol>
    <symbol id="i-checklist" viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1.5"></rect><path d="m5 7 1.2 1.2L8.5 6"></path><path d="M13 7h8"></path><rect x="3" y="14" width="6" height="6" rx="1.5"></rect><path d="M13 17h8"></path></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 7h16v13H4zM3 4h18v3H3zM9 11h6"></path></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2"></circle><circle cx="6" cy="12" r="2"></circle><circle cx="18" cy="19" r="2"></circle><path d="m8 11 8-5M8 13l8 5"></path></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"></path></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"></path></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"></path><path d="M15 4v5h4"></path></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"></path></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9m-5 5 5-5 5 5M5 4h14"></path></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"></path><circle cx="4" cy="6" r="1"></circle><circle cx="4" cy="12" r="1"></circle><circle cx="4" cy="18" r="1"></circle></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></symbol>
  </svg>

  <div id="app-frame">
    <section id="onboarding" class="onboarding" aria-hidden="true">
      <div class="statusbar-spacer"></div>
      <div class="onboarding-center">
        <div class="onboarding-icon"><svg><use href="#i-note"></use></svg></div>
        <h1>생각은 지금 적고,<br>정리는 나중에.</h1>
        <p>제목도 폴더도 필요 없습니다.<br>떠오른 내용을 바로 남기세요.</p>
        <button id="btn-onboarding-start" class="primary-button">시작하기</button>
      </div>
    </section>

    <div id="tab-stack">
      <section class="tab-screen active" id="tab-main">
        <div class="statusbar-spacer"></div>
        <header class="topbar">
          <div class="brand-row">
            <div>
              <div class="app-title">까먹자</div>
              <div class="app-subtitle">나에게 메모</div>
            </div>
            <button id="btn-settings-open" class="icon-button" aria-label="설정 열기">
              <svg><use href="#i-settings"></use></svg>
            </button>
          </div>

          <div class="mode-segment" id="mode-segment">
            <button class="active" data-mode="memo">Memo</button>
            <button data-mode="todo">Todo</button>
          </div>

          <button id="btn-search-open" class="search-trigger">
            <svg><use href="#i-search"></use></svg>
            <span>메모와 링크 검색</span>
          </button>

          <div class="smart-filters" id="smart-filters">
            <button class="active" data-filter="all">전체</button>
            <button data-filter="today">오늘</button>
            <button data-filter="pinned">고정</button>
            <button data-filter="links">링크</button>
          </div>

          <div class="link-view-toolbar hidden" id="link-view-toolbar">
            <span>링크 모아보기</span>
            <div class="icon-segment" id="link-view-segment">
              <button class="active" data-view="list" aria-label="리스트 보기"><svg><use href="#i-list"></use></svg></button>
              <button data-view="grid" aria-label="그리드 보기"><svg><use href="#i-grid"></use></svg></button>
            </div>
          </div>
        </header>

        <section id="pinned-section" class="pinned-section hidden">
          <div class="pinned-head">
            <span><svg><use href="#i-pin"></use></svg>고정된 메모 <b id="pinned-count">0</b></span>
            <button id="btn-pinned-open">전체보기</button>
          </div>
          <div id="pinned-list" class="pinned-list"></div>
        </section>

        <main id="main-list" class="timeline"></main>

        <section class="composer">
          <div id="compose-mode-chip" class="compose-chip hidden">
            <svg><use href="#i-checklist"></use></svg>
            <span>Todo 작성 중</span>
            <button id="btn-compose-mode-clear" aria-label="Todo 작성 취소"><svg><use href="#i-close"></use></svg></button>
          </div>
          <div id="compose-revisit-chip" class="compose-chip revisit hidden">
            <svg><use href="#i-clock"></use></svg>
            <span id="compose-revisit-label"></span>
            <button id="btn-compose-revisit-clear" aria-label="다시 보기 설정 제거"><svg><use href="#i-close"></use></svg></button>
          </div>
          <div id="compose-tools" class="compose-tools">
            <button id="btn-tool-todo"><svg><use href="#i-checklist"></use></svg><span>Todo</span></button>
            <button id="btn-tool-revisit"><svg><use href="#i-clock"></use></svg><span>다시 보기</span></button>
          </div>
          <div class="input-shell">
            <button id="btn-compose-tools" class="circle-button" aria-label="추가 기능"><svg><use href="#i-plus"></use></svg></button>
            <textarea id="compose-input" rows="1" placeholder="무엇이든 적어두세요"></textarea>
            <button id="btn-send" class="send-button" disabled aria-label="저장"><svg><use href="#i-send"></use></svg></button>
          </div>
        </section>

        <nav class="bottom-nav">
          <button class="active" data-tab="main"><svg><use href="#i-note"></use></svg><span>메모</span></button>
          <button data-tab="revisit"><svg><use href="#i-clock"></use></svg><span>다시 보기</span><b id="revisit-badge" class="nav-badge hidden">0</b></button>
          <button data-tab="archive"><svg><use href="#i-archive"></use></svg><span>보관함</span></button>
        </nav>
      </section>

      <section class="tab-screen" id="tab-revisit" hidden>
        <div class="statusbar-spacer"></div>
        <header class="simple-topbar"><h2>다시 보기</h2></header>
        <main id="revisit-list" class="timeline"></main>
        <nav class="bottom-nav">
          <button data-tab="main"><svg><use href="#i-note"></use></svg><span>메모</span></button>
          <button class="active" data-tab="revisit"><svg><use href="#i-clock"></use></svg><span>다시 보기</span></button>
          <button data-tab="archive"><svg><use href="#i-archive"></use></svg><span>보관함</span></button>
        </nav>
      </section>

      <section class="tab-screen" id="tab-archive" hidden>
        <div class="statusbar-spacer"></div>
        <header class="simple-topbar"><h2>보관함</h2></header>
        <div id="archive-segment" class="archive-segment">
          <button class="active" data-status="archived">보관 <span id="count-archived">0</span></button>
          <button data-status="completed">완료 <span id="count-completed">0</span></button>
          <button data-status="trashed">휴지통 <span id="count-trashed">0</span></button>
        </div>
        <p id="archive-caption" class="archive-caption">나중에 다시 필요할 수 있는 메모</p>
        <main id="archive-list" class="timeline"></main>
        <nav class="bottom-nav">
          <button data-tab="main"><svg><use href="#i-note"></use></svg><span>메모</span></button>
          <button data-tab="revisit"><svg><use href="#i-clock"></use></svg><span>다시 보기</span></button>
          <button class="active" data-tab="archive"><svg><use href="#i-archive"></use></svg><span>보관함</span></button>
        </nav>
      </section>
    </div>

    <section id="screen-detail" class="overlay-screen">
      <div class="statusbar-spacer"></div>
      <header class="screen-header">
        <button id="btn-detail-back" class="icon-button" aria-label="뒤로"><svg><use href="#i-back"></use></svg></button>
        <div class="screen-header-actions">
          <button id="btn-detail-pin" class="icon-button" aria-label="고정"><svg><use href="#i-pin"></use></svg></button>
          <button id="btn-detail-more" class="icon-button" aria-label="더보기"><svg><use href="#i-more"></use></svg></button>
        </div>
      </header>
      <main class="detail-main">
        <div id="detail-content" class="detail-content"></div>
        <textarea id="detail-editor" class="detail-editor hidden"></textarea>
        <div id="detail-meta" class="detail-meta"></div>
      </main>
      <div id="detail-edit-actions" class="detail-edit-actions hidden">
        <button id="btn-detail-edit-cancel">취소</button>
        <button id="btn-detail-edit-save">저장</button>
      </div>
      <div id="detail-action-grid" class="detail-action-grid"></div>
    </section>

    <section id="screen-search" class="overlay-screen">
      <div class="statusbar-spacer"></div>
      <header class="search-header">
        <button id="btn-search-back" class="icon-button" aria-label="뒤로"><svg><use href="#i-back"></use></svg></button>
        <label class="search-field">
          <svg><use href="#i-search"></use></svg>
          <input id="search-input" type="search" placeholder="기억나는 단어를 입력하세요" autocomplete="off">
        </label>
      </header>
      <div id="search-type-filters" class="horizontal-filters">
        <button class="active" data-type="all">전체</button>
        <button data-type="text">Memo</button>
        <button data-type="checklist">Todo</button>
        <button data-type="link">링크</button>
      </div>
      <div id="search-date-filters" class="horizontal-filters secondary">
        <button class="active" data-range="all">전체 기간</button>
        <button data-range="today">오늘</button>
        <button data-range="7d">최근 7일</button>
        <button data-range="month">이번 달</button>
      </div>
      <main id="search-results" class="timeline"></main>
    </section>

    <section id="screen-pinned" class="overlay-screen">
      <div class="statusbar-spacer"></div>
      <header class="screen-header title-header">
        <button id="btn-pinned-back" class="icon-button" aria-label="뒤로"><svg><use href="#i-back"></use></svg></button>
        <h2>고정된 메모</h2>
      </header>
      <main id="pinned-all-list" class="timeline"></main>
    </section>

    <section id="screen-settings" class="overlay-screen">
      <div class="statusbar-spacer"></div>
      <header class="screen-header title-header">
        <button id="btn-settings-back" class="icon-button" aria-label="뒤로"><svg><use href="#i-back"></use></svg></button>
        <h2>설정</h2>
      </header>
      <main class="settings-page">
        <div class="settings-brand">
          <div class="settings-brand-icon"><svg><use href="#i-note"></use></svg></div>
          <div><strong>까먹자</strong><span>나에게 메모</span></div>
        </div>

        <h3>표시</h3>
        <section class="settings-card">
          <div class="setting-block">
            <div class="setting-title">테마</div>
            <div id="theme-grid" class="theme-grid">
              <button data-theme="base"><i style="--swatch:#F6F7F9"></i>기본</button>
              <button data-theme="mist"><i style="--swatch:#ECEFF2"></i>안개</button>
              <button data-theme="cream"><i style="--swatch:#F7F1E5"></i>크림</button>
              <button data-theme="leaf"><i style="--swatch:#EAF2E9"></i>잎새</button>
              <button data-theme="sky"><i style="--swatch:#EAF2F8"></i>하늘</button>
              <button data-theme="violet"><i style="--swatch:#F0ECF8"></i>보라빛</button>
              <button data-theme="apricot"><i style="--swatch:#FAEEE6"></i>살구</button>
              <button data-theme="rose"><i style="--swatch:#F8EDEF"></i>장미</button>
              <button data-theme="night"><i style="--swatch:#151B22"></i>밤</button>
            </div>
          </div>

          <label class="setting-row">
            <span><strong>사용자 지정 배경</strong><small>선택한 색에 맞춰 카드와 글자 색도 함께 조정합니다.</small></span>
            <input id="custom-theme-color" type="color" value="#F6F7F9">
          </label>

          <div class="setting-block">
            <div class="setting-heading"><span class="setting-title">글자 크기</span><output id="font-size-output">15px</output></div>
            <input id="font-size-range" type="range" min="13" max="19" step="1" value="15">
          </div>

          <div class="setting-block">
            <div class="setting-title">글자 굵기</div>
            <div id="font-weight-segment" class="setting-segment">
              <button data-value="400">보통</button>
              <button data-value="500">중간</button>
              <button data-value="700">굵게</button>
            </div>
          </div>

          <div class="setting-block">
            <div class="setting-title">UI 밀도</div>
            <div id="density-segment" class="setting-segment">
              <button data-value="wide">넓게</button>
              <button data-value="normal">보통</button>
              <button data-value="compact">촘촘하게</button>
            </div>
          </div>

          <div class="setting-block">
            <div class="setting-title">카드 모양</div>
            <div id="card-shape-segment" class="setting-segment">
              <button data-value="standard">보통</button>
              <button data-value="round">둥글게</button>
            </div>
          </div>
        </section>

        <h3>메모</h3>
        <section class="settings-card">
          <div class="setting-block">
            <div class="setting-title">기본 화면</div>
            <div id="default-mode-segment" class="setting-segment">
              <button data-value="memo">Memo</button>
              <button data-value="todo">Todo</button>
            </div>
          </div>

          <label class="setting-row">
            <span><strong>URL 자동 감지</strong><small>주소가 포함된 메모를 링크 카드로 표시합니다.</small></span>
            <input id="url-detect-toggle" type="checkbox">
          </label>

          <div class="setting-block">
            <div class="setting-title">새 메모 위치</div>
            <div id="sort-segment" class="setting-segment">
              <button data-value="bottom">최신 아래</button>
              <button data-value="top">최신 위</button>
            </div>
          </div>
        </section>

        <h3>데이터</h3>
        <section class="settings-card">
          <button id="btn-backup" class="setting-action">
            <span><strong>JSON 백업</strong><small>모든 메모와 설정을 파일로 저장합니다.</small></span>
            <svg><use href="#i-download"></use></svg>
          </button>
          <button id="btn-restore" class="setting-action">
            <span><strong>백업 복원</strong><small>JSON 파일의 내용으로 현재 데이터를 교체합니다.</small></span>
            <svg><use href="#i-upload"></use></svg>
          </button>
          <input id="restore-file-input" class="hidden" type="file" accept="application/json">
          <button id="btn-delete-all" class="setting-action danger">
            <span><strong>전체 데이터 삭제</strong><small>모든 메모와 설정을 삭제합니다.</small></span>
            <svg><use href="#i-trash"></use></svg>
          </button>
        </section>

        <p class="settings-note">휴지통의 메모는 30일이 지나면 앱 실행 시 자동으로 삭제됩니다.</p>
        <p class="settings-version">까먹자 v1.0 · 로컬 저장</p>
      </main>
    </section>

    <div id="sheet-actions" class="sheet-overlay" aria-hidden="true">
      <section class="sheet compact-sheet">
        <div class="sheet-handle"></div>
        <p id="action-preview" class="sheet-preview"></p>
        <div id="action-list"></div>
      </section>
    </div>

    <div id="sheet-revisit" class="sheet-overlay" aria-hidden="true">
      <section class="sheet">
        <div class="sheet-handle"></div>
        <h3>언제 다시 볼까요?</h3>
        <div id="revisit-quick" class="quick-date-grid">
          <button data-days="1">내일</button>
          <button data-days="7">7일 후</button>
          <button data-days="30">30일 후</button>
          <button data-days="90">90일 후</button>
        </div>
        <label class="custom-date-row">
          <span>직접 선택</span>
          <input id="revisit-custom-input" type="datetime-local">
        </label>
        <button id="btn-revisit-confirm" class="primary-button" disabled>적용</button>
      </section>
    </div>

    <div id="modal-confirm" class="modal-overlay" aria-hidden="true">
      <section class="confirm-box">
        <h3 id="confirm-title"></h3>
        <p id="confirm-description"></p>
        <div class="confirm-actions">
          <button id="btn-confirm-cancel">취소</button>
          <button id="btn-confirm-ok">확인</button>
        </div>
      </section>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="./lang-ko.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
